[build]
  command = "npm ci --prefix frontend && npm run build --prefix frontend"
  publish = "frontend/dist/kids-game/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  included_files = ["backend/Data/game-catalog.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
